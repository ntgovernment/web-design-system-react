<script>
    window.onload = function () {
        var currentURL = window.location.hash;
        if (!currentURL) return;
        var anchorHashLinks = document.querySelectorAll('[href*="#"]');
        for (var i = 0; i < anchorHashLinks.length; i++) {
            if (anchorHashLinks[i].hash == currentURL) {
                var hashValue = anchorHashLinks[i].hash.substr(1);
                var el = document.getElementById(hashValue);
                if (el) el.scrollIntoView(true);
            }
        }
    }
</script>
