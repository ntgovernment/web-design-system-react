<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Display Cards - Auto Mode Preview</title>

  <link rel="stylesheet" href="https://nt.gov.au/__data/assets/git_bridge/0008/1607588/dist/theme-ntg.min.css" />
  <script src="https://kit.fontawesome.com/9bf658a5c7.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .preview-section {
      margin: 0 0 3rem;
      padding: 0;
      background: #fff;
    }

    .preview-section > h2 {
      margin: 0;
      padding: 1rem 1.5rem;
      background: #1f1f5f;
      color: #fff;
      font-size: 1rem;
    }

    .preview-section > h3 {
      margin: 0;
      padding: 0.5rem 1.5rem;
      font-size: 0.85rem;
      color: #555;
      background: #fafafa;
      border-bottom: 1px solid #e5e5e5;
    }

    .preview-host {
      padding: 1.5rem;
    }

    .note {
      margin: 1rem 1.5rem;
      padding: 0.75rem 1rem;
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 4px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="note">
    Local preview of the Display Cards DXP component. <strong>main.js</strong> renders the
    component HTML server-side.
  </div>

  <div class="preview-section">
    <h2>Auto mode</h2>
    <h3>Cards generated automatically from the children of the selected parent asset</h3>
    <div id="preview-auto" class="preview-host"></div>
  </div>

  <script type="module">
    import component from "./main.js";

    const response = await fetch("./auto-mode.data.json");
    const data = await response.json();

    function mount(targetId, html) {
      const host = document.getElementById(targetId);
      host.innerHTML = html;
    }

    mount("preview-auto", await component.main(data));
  </script>
</body>

</html>
