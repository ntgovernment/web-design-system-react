<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>MiniCards Component | Squiz DXP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- INLINE_THEME_CSS_START -->
  <style>
    /* NT Government theme CSS will be inlined here by build script */
  </style>
  <!-- INLINE_THEME_CSS_END -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .component-preview {
      background: white;
      margin: 20px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .component-header {
      background: linear-gradient(135deg, #0066cc 0%, #004ba0 100%);
      color: white;
      padding: 20px 30px;
    }
    .component-header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }
    .component-header p {
      margin: 5px 0 0 0;
      opacity: 0.9;
      font-size: 14px;
    }
    .component-content {
      padding: 0;
    }
    .metadata {
      background: #f9f9f9;
      border-bottom: 1px solid #e0e0e0;
      padding: 15px 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      font-size: 13px;
    }
    .metadata-item strong {
      display: block;
      color: #666;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .metadata-item {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="component-preview">
    <div class="component-header">
      <h1>MiniCards Component</h1>
      <p>Responsive grid of mini cards (icon + title + link)</p>
    </div>
    <div class="metadata">
      <div class="metadata-item">
        <strong>Version:</strong>
        <span>0.1.0</span>
      </div>
      <div class="metadata-item">
        <strong>Type:</strong>
        <span>Edge Component</span>
      </div>
      <div class="metadata-item">
        <strong>Namespace:</strong>
        <span>ntg-web-design-system</span>
      </div>
      <div class="metadata-item">
        <strong>Status:</strong>
        <span>Preview</span>
      </div>
    </div>
    <div class="component-content" id="component"></div>
  </div>

  <script type="module">
    // This is a client-side preview harness only.
    // In production, the DXP renderer will call main.js on the Edge runtime.
  </script>
</body>
</html>
