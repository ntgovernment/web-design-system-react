<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NT Gov MiniCards — Preview</title>
    <!-- Bootstrap 5.3 (CDN) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <!-- Font Awesome (NT Gov kit) -->
    <script
      src="https://kit.fontawesome.com/9bf658a5c7.js"
      crossorigin="anonymous"
    ></script>
    <!--
      NT Government theme bundle. Preview wrappers can include external CSS/JS,
      and many projects inline the theme CSS here at build time.
      Keep the placeholder markers so your prepare script can replace them.
    -->
    <!-- INLINE_THEME_CSS_START -->
    <style>
      /* placeholder — replaced at build time */
    </style>
    <!-- INLINE_THEME_CSS_END -->

    <!-- For local preview -->
    <style>
      /* ============================================
		         CSS Variables Fallbacks
		         ============================================ */
      :root {
        --sp-xs: 8px;
        --sp-sm: 12px;
        --sp-md: 16px;
        --sp-lg: 24px;
        --sp-xl: 32px;
        --sp-2xl: 48px;
        --type-heading-h2-size: 28px;
        --type-heading-h2-lh: 1.3;
        --type-heading-h2-weight: 600;
        --type-heading-h4-size: 18px;
        --type-heading-h4-lh: 1.4;
        --type-heading-h4-weight: 600;
        --clr-bg-default: #ffffff;
        --clr-bg-shade: #f5f5f5;
        --clr-text-default: #1f1f5f;
        --clr-text-emphasis: #c33826;
        --clr-border-subtle: #d9d9d9;
        --shadow-focus-ntg: rgba(255, 111, 0, 0.5);
      }
      /* ============================================
		         MiniCards Component Styling
		         ============================================ */
      /* Root container */
      .mini-cards {
        display: block;
        width: 100%;
        padding: var(--sp-lg);
        background-color: var(--clr-bg-default);
        border-radius: 0;
      }
      .mini-cards--bg-white {
        background-color: var(--clr-bg-default);
      }
      .mini-cards--bg-grey {
        background-color: var(--clr-bg-shade);
      }
      /* Title */
      .mini-cards__title {
        font-size: var(--type-heading-h2-size);
        line-height: var(--type-heading-h2-lh);
        font-weight: var(--type-heading-h2-weight);
        color: #222222;
        margin-top: var(--sp-lg);
        margin-bottom: var(--sp-lg);
        padding: 0;
      }
      /* Grid container */
      .mini-cards__grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: var(--sp-md);
        width: 100%;
      }
      .mini-cards--layout-3-col .mini-cards__grid {
        grid-template-columns: 1fr;
      }
      .mini-cards--layout-4-col .mini-cards__grid {
        grid-template-columns: 1fr;
      }
      @media (min-width: 576px) {
        .mini-cards--layout-3-col .mini-cards__grid,
        .mini-cards--layout-4-col .mini-cards__grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 768px) {
        .mini-cards--layout-3-col .mini-cards__grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .mini-cards--layout-4-col .mini-cards__grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      /* Card item wrapper */
      .mini-cards__item {
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      /* ============================================
		         Card Component Styling (Minicard Variant)
		         ============================================ */
      .card {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        border: 1px solid var(--clr-border-subtle);
        border-radius: 0;
        background-color: var(--clr-bg-default);
        text-decoration: none;
        color: inherit;
        transition:
          box-shadow 0.2s ease,
          background-color 0.2s ease;
      }
      .card:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .card:hover .card-title,
      .card:hover .card__minicard-icon {
        color: #c33826 !important;
      }
      .card:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--shadow-focus-ntg);
      }
      /* MiniCard variant */
      .card--minicard {
        padding: var(--sp-xl);
        border: 1px solid var(--clr-border-subtle);
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .card--minicard .card-body {
        padding: 0 !important;
        gap: var(--sp-sm);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .card--minicard .card__body-title-wrapper {
        gap: var(--sp-xs);
        flex-direction: column;
        align-items: center;
        display: flex;
        width: 100%;
      }
      .card--minicard .card-title {
        font-size: var(--type-heading-h4-size);
        line-height: var(--type-heading-h4-lh);
        font-weight: var(--type-heading-h4-weight);
        margin-bottom: 0;
        color: var(--clr-text-default);
      }
      .card--minicard .card__minicard-icon {
        width: var(--sp-2xl);
        height: var(--sp-2xl);
        font-size: var(--sp-xl);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--clr-text-emphasis) !important;
        margin: 0;
      }

      /* ============================================
         General Styling
         ============================================ */
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f5f5f5;
      }

      /* mimic typical page padding */
      .preview-page {
        padding: 2rem 1rem;
      }

      /* optional width constraint */
      .preview-container {
        max-width: 1200px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="preview-page">
      <div class="preview-container">[component://output]</div>
    </div>
  </body>
</html>
