<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NT Gov Header — Preview</title>

    <!-- Bootstrap 5.3 (CDN) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <!-- Font Awesome (NT Gov kit) -->
    <script
      src="https://kit.fontawesome.com/9bf658a5c7.js"
      crossorigin="anonymous"
    ></script>

    <!-- NT Government theme bundle (populated by `npm run build` into ./_assets/) -->
    <link rel="stylesheet" href="_assets/theme-ntg.min.css" />

    <style>
      body {
        margin: 0;
        font-family: var(--font-family-base, system-ui, sans-serif);
      }
      .preview-banner {
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        color: #555;
      }
      .preview-page {
        padding: 2rem 1rem;
      }
    </style>
  </head>
  <body>
    <div class="preview-banner">
      DXP Component Service preview — NT Gov Header
    </div>

    [component://output]

    <main class="preview-page container">
      <h1>Sample page content</h1>
      <p>
        This wrapper renders the SSR output above and then loads the
        client-side hydration bundle so the React Header mounts in place.
      </p>
    </main>

    <!-- React 18 (UMD, via CDN) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- Component bundle + hydration runtime (populated by `npm run build`) -->
    <script src="_assets/components.min.js"></script>
    <script src="_assets/hydrate.min.js"></script>
  </body>
</html>
