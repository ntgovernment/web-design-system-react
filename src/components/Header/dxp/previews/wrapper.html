<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NT Gov Header — Preview</title>

    <!-- Bootstrap 5.3 (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <!-- Font Awesome (NT Gov kit) -->
    <script src="https://kit.fontawesome.com/9bf658a5c7.js" crossorigin="anonymous"></script>

    <!--
      NT Government theme bundle. Squiz dev-ui only resolves fully qualified
      URLs from preview wrappers, so `npm run build` inlines the contents of
      dist/theme-ntg.min.css below by replacing the placeholder marker.
      DO NOT edit the placeholder line manually.
    -->
    <!-- INLINE_THEME_CSS_START -->
    <style>
        /* placeholder — replaced at build time */
    </style>
    <!-- INLINE_THEME_CSS_END -->

    <style>
        body {
            margin: 0;
            font-family: var(--font-family-base, system-ui, sans-serif);
        }

        .preview-banner {
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            color: #555;
        }

        .preview-page {
            padding: 2rem 1rem;
        }
    </style>
</head>

<body>
    <div class="preview-banner">
        DXP Component Service preview — NT Gov Header
    </div>

    [component://output]

    <main class="preview-page container">
        <h1>Sample page content</h1>
        <p>
            The header above is rendered server-side by <code>main.js</code>. A
            small inline script handles the hamburger toggle and icon-search
            expansion — no React or hydration runtime is required.
        </p>
    </main>
</body>

</html>
