<!--@@ Global alert @@-->
%begin_globals_site_metadata_site-alertType%
<div class="alert alert-%globals_site_metadata_site-alertType% alert-dismissible fade show mb-0 rounded-0" role="alert">
    <div class="container-xl ps-md-4">
        <small>
            <strong>%globals_site_metadata_site-alertTitle%</strong> <br>
            %globals_site_metadata_site-alertMessage%
        </small>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
%end_asset%


<div class="container d-none d-print-block">
    <img src="%globals_asset_url_with_hash:1484642:dist/ntgbase/images/ntg-logo.png%" alt="ntg-mono">
</div>

<header class="ntg-header d-print-none" id="header">
    <div class="navbar navbar-expand-md navbar-dark">
        <!--<div class="container-xl py-4 py-md-0 d-flex justify-content-between">-->
        <div class="container-xl p-0 p-lg-2 px-md-0 d-flex justify-content-between">
            <a href="%globals_site_url%">
                <img alt="NT.GOV.AU logo"
                    src="%globals_asset_url_with_hash:1607588:dist/ntgbase/images/ntg-desert-rose-reverse.svg%"
                    class="site-logo d-print-none">
                <span class="text-hide d-print-block site-name mt-5">NT.GOV.AU</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <nav class="nav nav-masthead justify-content-center d-print-none d-none d-md-flex" role="navigation">
                <!--<a href="https://health.nt.gov.au/covid-19" class="nav-link bg-blue" id="covidWebsiteLink" title="For COVID-19 news, updates and alerts, go to the coronavirus website.">Coronavirus (COVID-19) &nbsp<i class="fal fa-external-link-square fa-lg mr-2"></i></a>-->
                <a href="https://nt.gov.au/contacts" class="nav-link">Contacts</a>
                <div class="ps-4 d-lg-flex d-none">


                </div>
            </nav>
        </div>
    </div>


    <nav class="collapse navbar-collapse navbar-dark d-md-none" id="navbarCollapse" aria-role="navigation">

    </nav>

</header>


<div class="mobile-banner banner-search d-lg-none d-print-none">
    <div class="container">
        <div class="row">
            <div class="col-12 py-4 px-md-0">


                <form class="form-inline search d-print-none" action="https://nt.gov.au/search">
                    <div class="input-group p-0">
                        <input class="form-control" type="text" placeholder="Search" name="query" aria-label="Search"
                            autocomplete="off">
                        <div class="input-group-append">
                            <button class="btn" type="submit" aria-label="Apply search"><span
                                    class="text-hide">Search</span></button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
